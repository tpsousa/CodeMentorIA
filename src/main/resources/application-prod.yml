# Perfil de produção: PostgreSQL.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # o schema é criado/evoluído pelas migrations do Flyway
    open-in-view: false
  flyway:
    # Bancos antigos (criados com ddl-auto: update) são "baselinados" na V1
    # em vez de falhar; bancos novos aplicam todas as migrations normalmente.
    baseline-on-migrate: true
