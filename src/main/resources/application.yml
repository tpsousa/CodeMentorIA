spring:
  application:
    name: codementor-ai

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Respostas em streaming (SSE) podem demorar mais que o timeout padrão de async.
  mvc:
    async:
      request-timeout: 120s

  # Provedor padrão: Groq (gratuito). Troque via variáveis de ambiente — veja o README.
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.groq.com/openai}
      api-key: ${AI_API_KEY:coloque-sua-chave}
      chat:
        completions-path: ${AI_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${AI_MODEL:llama-3.3-70b-versatile}
          temperature: 0.2

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:10}
